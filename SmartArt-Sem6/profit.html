<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seller Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #D2B48C, #F5F5DC, #FFFFFF);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.6);
            padding: 20px;
            position: fixed;
            height: 100%;
            left: 0;
            top: 0;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 0 10px 10px 0;
        }
        .sidebar a {
            display: block;
            color: #34495e;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            margin: 40px 0;
            transition: 0.3s;
        }
        .sidebar a:hover {
            color: #f39c12;
        }
        .content {
            margin-left: 270px;
            padding: 20px;
            width: calc(100% - 270px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            position: relative;
        }
        .profit-text {
            font-size: clamp(2rem, 4vw, 2.5rem);
            font-weight: bold;
            color: black;
            position: absolute;
            top: 30px;
            left: 300px;
        }
        .profit-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding-top: 80px;
        }
        canvas {
            width: min(500px, 80vw) !important;
            height: auto !important;
        }
        .sidebar-toggle {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 30;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            font-size: 1.8rem;
            line-height: 1;
            padding: 0.4rem 0.7rem;
            display: none;
        }
        @media (max-width: 991.98px) {
            .sidebar {
                display: none;
            }
            .sidebar-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            .content {
                margin-left: 0;
                width: 100%;
                padding: 24px 12px;
                display: block;
            }
            .profit-text {
                position: static;
                display: block;
                margin: 16px auto 10px;
                text-align: center;
            }
            .profit-container {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <button class="btn sidebar-toggle d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sellerSidebar" aria-controls="sellerSidebar" aria-label="Open seller menu">☰</button>

    <div class="sidebar d-none d-lg-block">
        <a href="profile.html">Profile</a>
        <a href="profile.html">Upload Product</a>
        <a href="profile.html">Prediction</a>
        <a href="seller_about.html">About</a>
        <a href="#">Profit</a>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sellerSidebar" aria-labelledby="sellerSidebarLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sellerSidebarLabel">Seller Menu</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="nav flex-column">
                <a href="profile.html">Profile</a>
                <a href="profile.html">Upload Product</a>
                <a href="profile.html">Prediction</a>
                <a href="seller_about.html">About</a>
                <a href="#">Profit</a>
            </div>
        </div>
    </div>

    <div class="content" id="profit-section">
        <div class="profit-text">Profit 2024-25</div>
        <div class="profit-container">
            <canvas id="profitChart"></canvas>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const ctx = document.getElementById('profitChart').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['Sales 75%', 'Marketing 15%', 'Operations 15%', 'Other 50%'],
                datasets: [{
                    data: [75, 15, 15, 50],
                    backgroundColor: ['#E74C3C', '#3498DB', '#2ECC71', '#F1C40F'],
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 16
                            }
                        }
                    },
                    datalabels: {
                        color: '#fff',
                        font: {
                            size: 20,
                            weight: 'bold'
                        },
                        formatter: (value, ctx) => {
                            let percentage = ctx.chart.data.labels[ctx.dataIndex];
                            return percentage;
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
